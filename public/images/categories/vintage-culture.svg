<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b12" />
      <stop offset="100%" stop-color="#0d0c0a" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="1100" fill="url(#catGrad)" />
  
  <!-- Graphic Street Art Elements -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5">
    <circle cx="450" cy="450" r="300" fill="none" />
    <circle cx="450" cy="450" r="200" fill="none" stroke-dasharray="10 8" />
    <line x1="100" y1="100" x2="800" y2="800" />
    <line x1="800" y1="100" x2="100" y2="800" />
  </g>
  
  <!-- Large Perspective Typography Overlay -->
  <text x="450" y="480" text-anchor="middle" fill="#ffffff" opacity="0.07" font-family="Arial Black, Impact, sans-serif" font-size="160" font-weight="900" letter-spacing="10">VINTAGE</text>
  
  <!-- Gradient Fade -->
  <rect width="900" height="1100" fill="url(#overlay)" />
  
  <!-- Badge -->
  <rect x="70" y="70" width="160" height="34" rx="17" fill="#000000" stroke="#fbbf24" stroke-width="1.5" />
  <text x="150" y="92" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700" letter-spacing="3">CATEGORY</text>
  
  <!-- Category Details -->
  <g transform="translate(70, 940)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" letter-spacing="2">VINTAGE / CULTURE</text>
    <text x="0" y="38" fill="#fbbf24" font-family="sans-serif" font-size="17" font-weight="500" letter-spacing="1">Retro • 90s Halftone • Timeless</text>
    <text x="0" y="70" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="4">EXPLORE COLLECTION →</text>
  </g>
</svg>